name: Release

# Every green push on main is already published by the Build workflow (v0.3.1, v0.3.2…). Pushing a tag by hand
# changes the numbering: `git tag v0.4.0 && git push origin main v0.4.0` publishes 0.4.0, and the next pushes give
# 0.4.1, 0.4.2… The README's download button and scripts/install.sh always fetch the latest version.
on:
  push:
    tags: ['v*']

# Read only by default: the job below writes the release alone (through gh and its token, never git push).
# Actions are pinned to a commit (the version in the comment): a moved tag cannot change what runs here.
permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the previous version, for the notes
          persist-credentials: false
      - name: Build the universal app
        run: CMC_VERSION="${GITHUB_REF_NAME#v}" ./scripts/build_app.sh --no-install --zip --universal
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish_release.sh "${GITHUB_REF_NAME#v}" build/CleanMyClaude.zip
